name: Speculative decoding math
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/spec_math.py'
      - 'tests/test_spec_math.py'
      - '.github/workflows/spec-math.yml'
  pull_request:
    paths:
      - 'tools/spec_math.py'
      - 'tests/test_spec_math.py'
      - '.github/workflows/spec-math.yml'
permissions:
  contents: read
jobs:
  math:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
