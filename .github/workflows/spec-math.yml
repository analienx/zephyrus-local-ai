name: CPU-only research correctness
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/spec_math.py'
      - 'tools/static_memory_budget.py'
      - 'tools/native_loader_ledger.py'
      - 'tools/safetensors_header_audit.py'
      - 'tools/model_residency_plan.py'
      - 'tests/test_spec_math.py'
      - 'tests/test_static_memory_budget.py'
      - 'tests/test_native_loader_ledger.py'
      - 'tests/test_safetensors_header_audit.py'
      - 'tests/test_model_residency_plan.py'
      - '.github/workflows/spec-math.yml'
  pull_request:
    paths:
      - 'tools/spec_math.py'
      - 'tools/static_memory_budget.py'
      - 'tools/native_loader_ledger.py'
      - 'tools/safetensors_header_audit.py'
      - 'tools/model_residency_plan.py'
      - 'tests/test_spec_math.py'
      - 'tests/test_static_memory_budget.py'
      - 'tests/test_native_loader_ledger.py'
      - 'tests/test_safetensors_header_audit.py'
      - 'tests/test_model_residency_plan.py'
      - '.github/workflows/spec-math.yml'
permissions:
  contents: read
jobs:
  cpu-correctness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
