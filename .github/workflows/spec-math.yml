name: CPU-only research correctness
on:
  workflow_dispatch:
  push:
    paths:
      - 'bench/**'
      - 'tests/test_campaign.py'
      - 'tests/test_fitness.py'
      - 'tests/test_collector.py'
      - 'tests/test_code_judge.py'
      - 'tests/test_telemetry.py'
      - 'tools/spec_math.py'
      - 'tools/static_memory_budget.py'
      - 'tools/serving_preflight.py'
      - 'tools/build_quant_cache_guard_patch.py'
      - 'profiles/qwen38-27b-exl3-3bpw-text-mtp.json'
      - 'patches/exllamav3/0001-opt-in-strict-quantized-cache.patch'
      - 'tools/native_loader_ledger.py'
      - 'tools/safetensors_header_audit.py'
      - 'tools/model_residency_plan.py'
      - 'tests/test_spec_math.py'
      - 'tests/test_static_memory_budget.py'
      - 'tests/test_serving_preflight.py'
      - 'tests/test_native_loader_ledger.py'
      - 'tests/test_safetensors_header_audit.py'
      - 'tests/test_model_residency_plan.py'
      - 'bench/**'
      - 'tests/test_agent*.py'
      - 'tests/test_config_agent_task.py'
      - 'tests/test_repo*.py'
      - 'bench/**'
      - 'tests/**'
      - '.github/workflows/spec-math.yml'
  pull_request:
    paths:
      - 'bench/**'
      - 'tests/test_campaign.py'
      - 'tests/test_fitness.py'
      - 'tests/test_collector.py'
      - 'tests/test_code_judge.py'
      - 'tests/test_telemetry.py'
      - 'tools/spec_math.py'
      - 'tools/static_memory_budget.py'
      - 'tools/serving_preflight.py'
      - 'tools/build_quant_cache_guard_patch.py'
      - 'profiles/qwen38-27b-exl3-3bpw-text-mtp.json'
      - 'patches/exllamav3/0001-opt-in-strict-quantized-cache.patch'
      - 'tools/native_loader_ledger.py'
      - 'tools/safetensors_header_audit.py'
      - 'tools/model_residency_plan.py'
      - 'tests/test_spec_math.py'
      - 'tests/test_static_memory_budget.py'
      - 'tests/test_serving_preflight.py'
      - 'tests/test_native_loader_ledger.py'
      - 'tests/test_safetensors_header_audit.py'
      - 'tests/test_model_residency_plan.py'
      - 'bench/**'
      - 'tests/test_agent*.py'
      - 'tests/test_config_agent_task.py'
      - 'tests/test_repo*.py'
      - 'bench/**'
      - 'tests/**'
      - '.github/workflows/spec-math.yml'
permissions:
  contents: read
jobs:
  cpu-correctness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m bench.fitness --suite bench/fixtures/smoke-suite.json --records bench/fixtures/simulated-trials.jsonl --arm-a A --arm-b B --output .local/benchmark/simulated-report.json
      - run: python -m bench.collector --suite bench/fixtures/smoke-suite.json
